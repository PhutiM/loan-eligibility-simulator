services:
  simulator:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8080:3000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

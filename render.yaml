services:
  - type: web
    name: loan-eligibility-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    branch: main
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - backend/**
        - Dockerfile.backend
        - render.yaml
    healthCheckPath: /api/health
    envVars:
      - key: FRONTEND_ORIGIN
        value: https://phutim.github.io

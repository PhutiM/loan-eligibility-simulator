name: .NET CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test application
        run: dotnet test backend.test/LoanEligibility.Api.Tests.csproj --configuration Release

      - name: Publish application
        run: dotnet publish backend/LoanEligibility.Api.csproj --configuration Release --no-restore

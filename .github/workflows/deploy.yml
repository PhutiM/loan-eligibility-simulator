name: CI and GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test backend
        run: npm test --workspace backend

      - name: Test frontend with coverage thresholds
        run: npm run test:coverage --workspace frontend

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: VITE_BASE_PATH="/${GITHUB_REPOSITORY#*/}/" npm run build

  deploy:
    if: github.event_name != 'pull_request' && vars.VITE_API_BASE_URL != ''
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate backend URL
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          case "$VITE_API_BASE_URL" in
            https://*) ;;
            *)
              echo "::error::VITE_API_BASE_URL must be a public HTTPS origin for the separately hosted backend."
              exit 1
              ;;
          esac

      - name: Build frontend for GitHub Pages
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: VITE_BASE_PATH="/${GITHUB_REPOSITORY#*/}/" npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
